name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: End-to-end run on synthetic data
        run: |
          python scripts/make_synthetic_data.py --out example_data
          python -m dmp --data-dir example_data --output-dir example_outputs
          test -f example_outputs/tables/thesis_tables.xlsx
